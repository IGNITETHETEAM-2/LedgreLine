services:
  - type: web
    name: ledgerline
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerline-db
          property: connectionString

databases:
  - name: ledgerline-db
    databaseName: ledgerline
    user: ledgerline
    plan: free
    region: singapore
